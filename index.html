<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>入試日報新聞 - 共通テスト・大学入試情報自動まとめ</title>
  <style>
    :root {
      --paper-bg: #fdfbf7;
      --paper-text: #111111;
      --accent-red: #d9381e;
      --border-color: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--paper-bg);
      color: var(--paper-text);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS PMincho", serif;
      line-height: 1.8;
      padding-top: 70px;
    }

    /* 左上 カウントダウン (赤文字) */
    .countdown-banner {
      position: fixed;
      top: 15px;
      left: 15px;
      color: var(--accent-red);
      font-weight: bold;
      font-size: 1.1rem;
      z-index: 100;
      background: rgba(253, 251, 247, 0.95);
      padding: 6px 12px;
      border: 2px solid var(--accent-red);
      box-shadow: 2px 2px 0px var(--accent-red);
      letter-spacing: 0.05em;
    }

    /* サイドメニュー開閉ボタン (三本線) */
    .menu-trigger {
      position: fixed;
      top: 15px;
      right: 15px;
      width: 44px;
      height: 44px;
      background: #ffffff;
      border: 2px solid var(--border-color);
      font-size: 1.5rem;
      cursor: pointer;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 2px 0px var(--border-color);
    }

    /* サイドバー */
    .sidebar {
      position: fixed;
      top: 0;
      right: -360px;
      width: 340px;
      height: 100%;
      background: #ffffff;
      border-left: 2px solid var(--border-color);
      z-index: 150;
      transition: right 0.3s ease;
      padding: 80px 20px 20px 20px;
      display: flex;
      flex-direction: column;
      box-shadow: -4px 0 10px rgba(0,0,0,0.1);
      font-family: sans-serif;
    }

    .sidebar.open { right: 0; }
    .sidebar h2 { font-size: 1.1rem; border-bottom: 2px solid var(--border-color); padding-bottom: 5px; margin-bottom: 15px; }

    .api-key-section { margin-bottom: 20px; }
    .api-key-section input { width: 100%; padding: 8px; border: 1px solid #ccc; margin-top: 5px; font-size: 0.85rem; }

    .save-btn {
      margin-top: 8px; width: 100%; padding: 8px; background: #222; color: #fff; border: none; cursor: pointer; font-size: 0.85rem;
    }
    .save-btn:hover { background: #444; }

    /* チャットエリア */
    .chat-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .chat-messages {
      flex: 1; overflow-y: auto; border: 1px solid #eee; padding: 10px; background: #f9f9f9; font-size: 0.85rem; margin-bottom: 10px;
    }
    .chat-msg { margin-bottom: 12px; padding: 8px 10px; border-radius: 4px; max-width: 90%; line-height: 1.5; }
    .chat-msg.user { background: #e1f5fe; margin-left: auto; color: #01579b; }
    .chat-msg.ai { background: #ffffff; border: 1px solid #ddd; color: #222; }

    .chat-input-box { display: flex; gap: 5px; }
    .chat-input-box input { flex: 1; padding: 8px; border: 1px solid #ccc; font-size: 0.85rem; }

    /* 新聞レイアウト */
    .newspaper-container { max-width: 900px; margin: 0 auto; padding: 20px; }
    .newspaper-header { text-align: center; border-bottom: 3px double var(--border-color); padding-bottom: 15px; margin-bottom: 25px; }
    .newspaper-title { font-size: 2.8rem; font-weight: 900; letter-spacing: 0.2em; margin-bottom: 10px; }
    .newspaper-meta {
      display: flex; justify-content: space-between; border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); padding: 5px 10px; font-size: 0.85rem;
    }

    /* 最新記事（大きく表示） */
    .latest-news { border: 2px solid var(--border-color); padding: 30px; background: #ffffff; margin-bottom: 40px; position: relative; }
    .breaking-tag {
      display: inline-block; background: var(--accent-red); color: #ffffff; padding: 3px 10px; font-size: 0.85rem; font-weight: bold; margin-bottom: 12px; font-family: sans-serif;
    }
    .latest-title { font-size: 1.9rem; line-height: 1.4; margin-bottom: 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 12px; font-weight: bold; }
    .latest-body { font-size: 1.05rem; text-align: justify; column-count: 2; column-gap: 35px; column-rule: 1px solid #ddd; white-space: pre-wrap; }

    @media (max-width: 650px) { .latest-body { column-count: 1; } }

    /* 下部 アーカイブ（過去記事リスト化） */
    .archive-section { border-top: 2px solid var(--border-color); padding-top: 20px; }
    .archive-heading { font-size: 1.2rem; margin-bottom: 15px; }
    .archive-list { list-style: none; display: grid; gap: 10px; }
    .archive-item {
      background: #ffffff; border: 1px solid #ccc; padding: 12px 15px; cursor: pointer; transition: background 0.2s; display: flex; justify-content: space-between; align-items: center;
    }
    .archive-item:hover { background: #f0ede6; }
    .archive-date { font-size: 0.85rem; color: #666; font-family: sans-serif; }
    .archive-title { font-size: 0.95rem; font-weight: bold; }

    /* モーダル */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 300; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-content { background: var(--paper-bg); border: 2px solid var(--border-color); padding: 30px; max-width: 650px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative; }
    .modal-close { position: absolute; top: 10px; right: 15px; font-size: 1.5rem; cursor: pointer; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : { apiKey: "demo", authDomain: "demo.firebaseapp.com", projectId: "nyushi-nippo" };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'nyushi-nippo-app';

    async function initFirebase() {
      try {
        await signInAnonymously(auth);
      } catch (e) {
        console.warn("Auth error:", e);
      }

      const articlesRef = collection(db, 'artifacts', appId, 'public', 'data', 'articles');
      onSnapshot(articlesRef, (snapshot) => {
        const docs = [];
        snapshot.forEach((doc) => { docs.push({ id: doc.id, ...doc.data() }); });

        if (docs.length > 0) {
          docs.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
          renderLatestArticle(docs[0]);
          renderArchiveList(docs.slice(1));
        }
      });
    }

    function renderLatestArticle(article) {
      document.getElementById('latestTag').textContent = article.isBreaking ? '【速報】' : '定例号（月・木発行）';
      document.getElementById('latestTag').style.backgroundColor = article.isBreaking ? 'var(--accent-red)' : '#333';
      document.getElementById('latestTitle').textContent = article.title || 'タイトルなし';
      document.getElementById('latestBody').textContent = article.content || '本文なし';
      document.getElementById('paperDateText').textContent = `${article.publishDate || ''} 発行`;
    }

    function renderArchiveList(archives) {
      const listEl = document.getElementById('archiveList');
      listEl.innerHTML = '';
      if (archives.length === 0) {
        listEl.innerHTML = '<li style="font-size:0.85rem; color:#666;">過去の新聞記事はまだありません</li>';
        return;
      }
      archives.forEach((article) => {
        const li = document.createElement('li');
        li.className = 'archive-item';
        li.innerHTML = `
          <span class="archive-title">${article.isBreaking ? '【速報】' : ''}${article.title}</span>
          <span class="archive-date">${article.publishDate || ''}</span>
        `;
        li.onclick = () => window.openArticleModal(article);
        listEl.appendChild(li);
      });
    }

    window.openArticleModal = (article) => {
      document.getElementById('modalDate').textContent = article.publishDate || '';
      document.getElementById('modalTitle').textContent = (article.isBreaking ? '【速報】' : '') + article.title;
      document.getElementById('modalBody').textContent = article.content || '';
      document.getElementById('modalOverlay').classList.add('open');
    };

    window.addEventListener('DOMContentLoaded', initFirebase);
  </script>
</head>
<body>

  <!-- 左上 カウントダウン (赤文字) -->
  <div class="countdown-banner" id="countdownBanner">共通テストまで残り -- 日</div>

  <!-- サイドメニュー開閉ボタン (三本線) -->
  <button class="menu-trigger" id="menuBtn">☰</button>

  <!-- サイドバー -->
  <aside class="sidebar" id="sidebar">
    <h2>入試AIアシスタント</h2>
    <div class="api-key-section">
      <label style="font-size:0.8rem; color:#555;">Gemini APIキー登録</label>
      <input type="password" id="apiKeyInput" placeholder="AI Studioのキーを入力">
      <button class="save-btn" id="saveKeyBtn">キーを保存</button>
      <div id="keyStatus" style="font-size:0.75rem; color:green; margin-top:4px;"></div>
    </div>

    <div class="chat-section">
      <div class="chat-messages" id="chatMessages">
        <div class="chat-msg ai">入試情報に関する質問を入力してください 記号なしでご回答いたします</div>
      </div>
      <div class="chat-input-box">
        <input type="text" id="chatInput" placeholder="例: 共通テストの注意点">
        <button class="save-btn" id="sendBtn" style="margin-top:0; width:60px;">送信</button>
      </div>
    </div>
  </aside>

  <!-- メイン画面 -->
  <div class="newspaper-container">
    <header class="newspaper-header">
      <h1 class="newspaper-title">入試日報新聞</h1>
      <div class="newspaper-meta">
        <span>更新頻度: 週2回（月・木）+ 速報随時</span>
        <span id="paperDateText">読み込み中...</span>
        <span>発行: 入試情報自動集約局</span>
      </div>
    </header>

    <main>
      <!-- 最新の新聞（大きく表示） -->
      <article class="latest-news">
        <span class="breaking-tag" id="latestTag">読み込み中</span>
        <h2 class="latest-title" id="latestTitle">最新の入試情報を取得しています...</h2>
        <div class="latest-body" id="latestBody">データベースから新聞データを読み込んでいます。しばらくお待ちください。</div>
      </article>

      <!-- 下部：今までの新聞（リスト化、押すと見られる） -->
      <section class="archive-section">
        <h3 class="archive-heading">📰 過去の新聞アーカイブ（バックナンバー）</h3>
        <ul class="archive-list" id="archiveList"></ul>
      </section>
    </main>
  </div>

  <!-- モーダル（過去記事閲覧用） -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <span class="modal-close" id="modalClose">&times;</span>
      <div class="archive-date" id="modalDate" style="margin-bottom:10px; color:#666; font-family:sans-serif;"></div>
      <h2 class="latest-title" id="modalTitle" style="font-size:1.4rem;"></h2>
      <div style="line-height:1.8; margin-top:15px; white-space:pre-wrap;" id="modalBody"></div>
    </div>
  </div>

  <script>
    // カウントダウン (2027年1月16日 共通テスト初日想定)
    function updateCountdown() {
      const examDate = new Date("2027-01-16T00:00:00+09:00");
      const diffTime = examDate - new Date();
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      document.getElementById('countdownBanner').textContent = diffDays > 0 ? `共通テストまで残り ${diffDays} 日` : `共通テスト当日・終了`;
    }

    const sidebar = document.getElementById('sidebar');
    document.getElementById('menuBtn').onclick = () => sidebar.classList.toggle('open');

    const apiKeyInput = document.getElementById('apiKeyInput');
    const keyStatus = document.getElementById('keyStatus');
    if (localStorage.getItem('gemini_api_key')) {
      apiKeyInput.value = localStorage.getItem('gemini_api_key');
      keyStatus.textContent = "保存済みのキーがあります";
    }
    document.getElementById('saveKeyBtn').onclick = () => {
      const key = apiKeyInput.value.trim();
      if (key) {
        localStorage.setItem('gemini_api_key', key);
        keyStatus.textContent = "キーを保存しました";
      } else {
        localStorage.removeItem('gemini_api_key');
        keyStatus.textContent = "キーを削除しました";
      }
    };

    // 記号を一切使わないフィルター（アルファベット、数字、かな、カナ、漢字、スペースのみ許容）
    function removeAllSymbols(str) {
      return str.replace(/[^\w\s\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF]/gu, '');
    }

    async function askGemini(promptText, apiKey) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;
      const systemPrompt = `あなたは大学入試情報の専門AIアシスタントです。質問に対して分かりやすく回答してください。
厳格な文字制約ルール:
1. アルファベット、数字、ひらがな、カタカナ、漢字のみを使用してください。
2. 句読点、記号、改行、絵文字、特殊文字は一切使用禁止です。
3. 文の区切りや単語の区切りには必ず半角または全角スペースを使用してください。`;

      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }], systemInstruction: { parts: [{ text: systemPrompt }] } })
      });
      const data = await response.json();
      const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "回答を取得できませんでした";
      return removeAllSymbols(aiText);
    }

    const chatInput = document.getElementById('chatInput');
    const chatMessages = document.getElementById('chatMessages');
    document.getElementById('sendBtn').onclick = async () => {
      const prompt = chatInput.value.trim();
      const apiKey = localStorage.getItem('gemini_api_key');
      if (!prompt || !apiKey) {
        if (!apiKey) alert('APIキーを登録してください');
        return;
      }
      appendChatMsg('user', prompt);
      chatInput.value = '';
      const loading = appendChatMsg('ai', '回答を作成中');
      loading.textContent = await askGemini(prompt, apiKey);
    };

    function appendChatMsg(role, text) {
      const div = document.createElement('div');
      div.className = `chat-msg ${role}`;
      div.textContent = text;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return div;
    }

    document.getElementById('modalClose').onclick = () => document.getElementById('modalOverlay').classList.remove('open');
    window.onload = updateCountdown;
  </script>
</body>
</html>
