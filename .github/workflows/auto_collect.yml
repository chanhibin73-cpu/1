name: Exam News Auto Collector

on:
  schedule:
    # 毎日 午前11時(JST) に定期実行 (UTC 02:00)
    - cron: '0 2 * * *'
    
    # さらに、速報や災害更新のために2時間おきに実行
    # 1日1記事制（IDが日付）のため、同じ記事が常に最新情報に上書き更新されます
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存ライブラリのインストール
        run: pip install firebase-admin

      - name: ニュース収集スクリプトの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python collect_news.py


