name: Exam News Auto Collector

on:
  schedule:
    # 日曜 12:01 JST (UTC 3:01) -> 月曜発行号のための収集
    - cron: '1 3 * * 0'
    # 水曜 12:01 JST (UTC 3:01) -> 木曜発行号のための収集
    - cron: '1 3 * * 3'
    # 毎時 0分実行 -> 重大な速報（isBreaking）検知用
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ニュース収集スクリプトの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_ID: ${{ secrets.APP_ID }}
        run: |
          python scripts/collect_news.py


