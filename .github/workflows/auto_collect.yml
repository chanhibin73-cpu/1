name: Exam News Auto Collector

on:
  schedule:
    # ----------------------------------------------------
    # 定例発行分 (すべて JST 朝8:00 に実行し、9時発行として扱う)
    # GitHubの仕様上、UTCで指定するため JST 8:00 は前日の UTC 23:00 になります。
    # ----------------------------------------------------
    - cron: '0 23 * * 1' # 日本時間の 火曜 朝8:00
    - cron: '0 23 * * 3' # 日本時間の 木曜 朝8:00
    - cron: '0 23 * * 5' # 日本時間の 土曜 朝8:00
    - cron: '0 23 * * 6' # 日本時間の 日曜 朝8:00
    
    # ----------------------------------------------------
    # 速報（号外）検知用 (2時間ごとに実行)
    # ----------------------------------------------------
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 管理者権限用ライブラリをインストール
      - name: 依存ライブラリのインストール
        run: pip install firebase-admin

      - name: ニュース収集スクリプトの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_ID: ${{ secrets.APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python scripts/collect_news.py


