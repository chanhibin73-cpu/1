name: Exam News Auto Collector

on:
  schedule:
    # ----------------------------------------------------
    # 定例発行分 (すべて JST 朝8:00 に実行し、9時発行として扱う)
    # ----------------------------------------------------
    - cron: '0 23 * * 1'
    - cron: '0 23 * * 3'
    - cron: '0 23 * * 5'
    - cron: '0 23 * * 6'
    
    # 速報（号外）検知用 (2時間ごとに実行)
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存ライブラリのインストール
        run: pip install firebase-admin

      - name: ニュース収集スクリプトの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        # ★ここを修正しました！「scripts/」を消して、直接ファイルを実行します
        run: |
          python collect_news.py


