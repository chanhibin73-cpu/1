name: News Update v2

on:
  schedule:
    - cron: '1 3 * * 0,3'
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-update:
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ライブラリインストール
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai requests

      - name: ニュース収集・要約・保存
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_ID: ${{ secrets.APP_ID }}
        run: |
          python -c '
          import os
          import json
          import re
          import requests
          import datetime
          import urllib.parse
          import google.generativeai as genai

          print("=== 新バージョン処理を開始 ===")
          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              print("エラー: APIキー未設定")
              exit(1)

          genai.configure(api_key=api_key)

          # ニュース取得
          query = urllib.parse.quote("共通テスト 大学入試 情報")
          url = f"https://news.google.com/rss/search?q={query}&hl=ja&gl=JP&ceid=JP:ja"
          res = requests.get(url, timeout=10)
          if res.status_code != 200:
              print("RSS取得失敗")
              exit(1)

          from xml.etree import ElementTree as ET
          root = ET.fromstring(res.content)
          texts = []
          for item in root.findall(".//item")[:8]:
              t = item.find("title").text if item.find("title") is not None else ""
              d = item.find("description").text if item.find("description") is not None else ""
              texts.append(f"・{t}: {d}")
          raw_news = "\n".join(texts)

          # Gemini要約
          prompt = f"以下のニュースから新聞記事を作成し、必ず以下のJSONフォーマットのみで出力してください。\n{{\"title\": \"30文字程度の見出し\", \"content\": \"300〜500文字の要約本文\", \"isBreaking\": false}}\n\n【ニュース】\n{raw_news}"
          model = genai.GenerativeModel(model_name="gemini-2.5-flash-preview-09-2025")
          response = model.generate_content(prompt, generation_config={"response_mime_type": "application/json"})
          cleaned = re.sub(r"^          cleaned = re.sub(r"\s*```$", "", cleaned, flags=re.MULTILINE).strip()
          article = json.loads(cleaned)

          # Firestore保存
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9)))
          date_str = now.strftime("%Y年%m月%d日")
          app_id = os.environ.get("APP_ID", "nyushi-nippo-app")
          firestore_url = f"https://firestore.googleapis.com/v1/projects/nyushi-nippo/databases/(default)/documents/artifacts/{app_id}/public/data/articles"

          payload = {
              "fields": {
                  "title": {"stringValue": article.get("title", "無題")},
                  "content": {"stringValue": article.get("content", "")},
                  "isBreaking": {"booleanValue": bool(article.get("isBreaking", False))},
                  "publishDate": {"stringValue": date_str},
                  "createdAt": {"timestampValue": now.isoformat("T")}
              }
          }

          r = requests.post(firestore_url, json=payload, timeout=15)
          if r.status_code == 200:
              print("✓ 保存成功！")
          else:
              print(f"保存エラー: {r.status_code} {r.text}")
              exit(1)
          '



