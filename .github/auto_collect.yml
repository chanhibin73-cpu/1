name: Exam News Auto Collector

on:
  schedule:
    # 月曜発行分 (日曜 12:01 JST = UTC 3:01)
    - cron: '1 3 * * 0'
    # 水曜発行分 (火曜 12:01 JST = UTC 3:01)
    - cron: '1 3 * * 2'
    # 金曜発行分 (木曜 12:01 JST = UTC 3:01)
    - cron: '1 3 * * 4'
    # 月曜発行分その2 または 土曜発行分 (土曜 12:01 JST = UTC 3:01)
    - cron: '1 3 * * 6'
    # 2時間に1回実行 -> 重大な速報（isBreaking）検知用
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ニュース収集スクリプトの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_ID: ${{ secrets.APP_ID }}
        run: |
          python scripts/collect_news.py

