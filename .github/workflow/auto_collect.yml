name: Exam News Auto Collector

on:
  schedule:
    - cron: '1 3 * * 0'
    - cron: '1 3 * * 2'
    - cron: '1 3 * * 4'
    - cron: '1 3 * * 6'
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 管理者権限用ライブラリをインストール
      - name: 依存ライブラリのインストール
        run: pip install firebase-admin

      - name: ニュース収集スクリプトの実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_ID: ${{ secrets.APP_ID }}
          # 取得したFirebaseの秘密鍵JSONを環境変数に渡す
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python scripts/collect_news.py


